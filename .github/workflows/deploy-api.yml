name: Deploy KidPulse API

on:
  push:
    branches: [dev, main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-kidpulse-api-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lunor-labs/kidpulse-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "sha_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "moving_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "sha_tag=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "moving_tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.moving_tag }}

      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ "${{ github.ref_name }}" = "main" ]; then
              DB_URL="${{ secrets.DATABASE_URL_PROD }}"
            else
              DB_URL="${{ secrets.DATABASE_URL_DEV }}"
            fi
            docker run --rm \
              --network ${{ secrets.DOCKER_NETWORK }} \
              -e DATABASE_URL="$DB_URL" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }} \
              npx prisma migrate deploy

      - name: Trigger Coolify deploy
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            WEBHOOK="${{ secrets.COOLIFY_DEPLOY_WEBHOOK_PROD }}"
          else
            WEBHOOK="${{ secrets.COOLIFY_DEPLOY_WEBHOOK_DEV }}"
          fi
          curl -fsS -X GET "$WEBHOOK" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"