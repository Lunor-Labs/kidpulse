NameP: Deploy KidPulse API

On:
  Push:
    Branches: [dev, main]
    Paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  Workflow_dispatch: {}

Concurrency:
  Group: deploy-kidpulse-api-${{ github.ref_name }}
  Cancel-in-progress: False

Env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lunor-labs/kidpulse-backend

Jobs:
  Build-and-deploy:
    Runs-on: ubuntu-latest
    Environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    Permissions:
      Contents: read
      Packages: write

    Steps:
      - Name: Checkout repository
        Uses: actions/checkout@v4

      - Name: Set image tags
        Id: vars
        Run: |
          If [ "${{ github.ref_name }}" = "main" ]; then
            Echo "sha_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            Echo "moving_tag=latest" >> "$GITHUB_OUTPUT"
          Else
            Echo "sha_tag=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            Echo "moving_tag=dev" >> "$GITHUB_OUTPUT"
          Fi

      - Name: Log in to GHCR
        Uses: docker/login-action@v3
        With:
          Registry: ${{ env.REGISTRY }}
          Username: ${{ github.actor }}
          Password: ${{ secrets.GITHUB_TOKEN }}

      - Name: Build and push image
        Uses: docker/build-push-action@v6
        With:
          Context: api
          Push: True
          Tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.moving_tag }}

      - Name: Run database migrations
        Uses: appleboy/ssh-action@v1
        With:
          Host: ${{ secrets.VPS_HOST }}
          Username: ${{ secrets.VPS_SSH_USER }}
          Key: ${{ secrets.VPS_SSH_KEY }}
          Script: |
            Docker run --rm \
              --network ${{ vars.DOCKER_NETWORK }} \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }} \
              Npx prisma migrate deploy

      - Name: Trigger Coolify deploy
        Run: |
          Curl -fsS -X POST "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
